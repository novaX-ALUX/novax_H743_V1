board: AF-H7_nano
platform:
  - ardupilot
  - betaflight
mcu: STM32H743xx
package: TFBGA-100
bootloader_board_id: 6200
source_tree: ../_shared/ardupilot
board_config: boards/AF-H7_nano/ardupilot
sensors:
  imu1: ICM-42688-P
  imu2: ICM-42688-P
  barometer: DPS310/DPS368 labels at U22 in the schematic; verify fitted revision
  barometer_firmware_backends: DPS310 / SPL06
  compass: IST8310
  osd: AT7456E
can:
  fdcan1: TJA1051TK/3
ports:
  serial1: VTX (SmartAudio)
  serial2: DJI O3 (SBUS RC)
  serial3: ELRS Receiver
  serial4: DJI O3 MSP
  serial6: GPS
  serial7: Spare
  serial8: Spare
i2c:
  bus0_internal:
    - DPS310/DPS368 (one barometer; alternative backend probes)
    - IST8310
  bus1_external:
    - GPS/Compass connector
motor_outputs: 10
